name: Backend

on:
  push:
    branches:
      - main
      - chore/monorepo-migration
    paths:
      - "backend/**"
      - "scripts/backend-ci-smoke.py"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/backend-ci-smoke.py"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOBILFUNK_CSRF: "0"
      MOBILFUNK_SECRET: ci-only-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-server.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend scripts/backend-ci-smoke.py

      # Das importierte Backend enthält derzeit keine automatisierten Tests.
      # Dieser isolierte Smoke-Test verwendet ausschließlich eine temporäre
      # SQLite-Datenbank und prüft App-Factory, Login und Session-API.
      - name: Run isolated backend smoke test
        run: python scripts/backend-ci-smoke.py
