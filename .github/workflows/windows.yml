name: Windows runtime

on:
  workflow_dispatch:
  push:
    branches: [main, chore/project-cleanup, feature/windows-runtime]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/windows/**"
      - "scripts/**"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/windows/**"
      - "scripts/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MOBILFUNK_CSRF: "0"
      MOBILFUNK_SECRET: ci-only-windows-secret
      MOBILFUNK_DATA_DIR: ${{ github.workspace }}\mobilfunk-data
      MOBILFUNK_WEBCONFIG_DIR: ${{ github.workspace }}\mobilfunk-data
      MOBILFUNK_NO_BROWSER: "1"
      MOBILFUNK_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-server.txt
      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q backend scripts
      - name: Run backend smoke tests
        shell: pwsh
        run: |
          python scripts/backend-ci-smoke.py
          python scripts/backend-regression-tests.py
      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem deploy/windows -Filter *.ps1 -Recurse
          $files += Get-Item scripts/smoke-test-windows.ps1
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell-Syntaxfehler: $($file.FullName)" }
          }
      - name: Start Waitress and run Windows smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:MOBILFUNK_DATA_DIR | Out-Null
          $process = Start-Process python -ArgumentList "backend/run_windows.py" -WorkingDirectory $PWD -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($process.HasExited) { throw "Waitress wurde beendet." }
            ./scripts/smoke-test-windows.ps1
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
